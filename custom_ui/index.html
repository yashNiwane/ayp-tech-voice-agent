<!DOCTYPE html>

<head>

  <style>
    /* Hide metrics tabs, debug panels, tech stack information */
    [data-slot="panel-metrics"],
    button[aria-label*="Metrics"],
    button[aria-label*="metrics"],
    button[title*="Metrics"],
    div[class*="metrics"],
    div[data-slot*="metrics"],
    button:has(svg.lucide-activity) {
      display: none !important;
    }
  </style>
  <script>
    // Ensure WebRTC peer connection always has STUN servers for NAT traversal across Cloudflare tunnels
    const OrigRTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection;
    if (OrigRTCPeerConnection) {
      window.RTCPeerConnection = function (config) {
        config = config || {};
        if (!config.iceServers || config.iceServers.length === 0) {
          config.iceServers = [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            { urls: "stun:stun2.l.google.com:19302" }
          ];
        }
        return new OrigRTCPeerConnection(config);
      };
      window.RTCPeerConnection.prototype = OrigRTCPeerConnection.prototype;
    }

    // Runtime cleaner that sanitizes any dynamic mentions of Gemini or tech stack
    const sanitizeDOM = () => {
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue && /gemini|pipecat|daily/i.test(node.nodeValue)) {
          node.nodeValue = node.nodeValue
            .replace(/GeminiLiveLLMService/gi, "AYP Voice Engine")
            .replace(/Gemini/gi, "AYP Intelligence")
            .replace(/Pipecat/gi, "AYP Tech")
            .replace(/Daily/gi, "AYP Network");
        }
      }
    };
    const observer = new MutationObserver(sanitizeDOM);
    window.addEventListener("DOMContentLoaded", () => {
      observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    });
  </script>
